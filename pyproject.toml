[project]
name = "video-preflight"
version = "0.1.0"
description = "Local video preflight with traceable evidence"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "python-multipart>=0.0.20,<1",
    "httpx>=0.28.1",
    "opencv-python>=5.0.0.93",
    "python-dotenv>=1.2.4",
    "numpy>=2.5.4",
    "openai>=3.42.0",
    "pandas>=3.1.0",
    "pydantic>=2.14.2",
    "shazamio>=0.9.0",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = []
